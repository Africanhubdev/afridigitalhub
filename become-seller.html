<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouvre ta boutique - AFRI DIGITAL HUB</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;padding:20px;text-align:center}
input,textarea{width:90%;padding:15px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff}
button{width:92%;padding:15px;background:#22c55e;color:#000;font-weight:bold;border:none;border-radius:10px;cursor:pointer;margin-top:15px;font-size:16px}
.box{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0;border:1px solid #334155}
</style>
</head>
<body>
<h1 style="color:#22c55e">Ouvre ta boutique</h1>
<p>Deviens vendeur en 30 secondes - Accepte SDA, ADH & <b style="color:#22c55e">ZMAF (2 ZMAF = 1 SDA)</b></p>

<div class="box">
<p style="font-size:13px;color:#94a3b8">💎 Paiements acceptés: ZMAF (Zoomer Africa), SDA, ADH, USDT, CDF, FCFA...</p>
</div>

<input id="name" placeholder="Nom de ta boutique (ex: Chez Amina)">
<input id="user" placeholder="@username (ex: amina_shop)">
<textarea id="bio" placeholder="Description de ta boutique..."></textarea>
<button onclick="createShop()">CRÉER MA BOUTIQUE - GRATUIT</button>

<p style="margin-top:20px;font-size:13px;color:#94a3b8"><a href="index.html" style="color:#3b82f6">← Retour au marché</a></p>

<script>
function createShop(){
let u=document.getElementById('user').value.trim();
if(!u){alert('Mets un @username');return;}
u=u.replace('@','');
alert('Boutique créée ! Lien: /shop.html?u='+u+'\nTu accepteras ZMAF + SDA + ADH automatiquement !');
location.href='shop.html?u='+u;
}
</script>
</body>
</html>
