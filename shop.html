<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shop</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:12px}.card{background:#1e293b;padding:12px;border-radius:12px;margin:10px 0;border:1px solid #334155} .lock{background:linear-gradient(90deg,#ef4444,#dc2626);padding:10px;border-radius:10px;text-align:center;margin:10px 0} button{padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer} .vip-badge{background:gold;color:#000;padding:2px 6px;border-radius:10px;font-size:10px} audio{width:100%}</style>
</head><body>
<h2>Shop <span id="shop"></span> <span id="badge"></span></h2>
<div id="lockMsg"></div>
<div id="products"></div>
<a id="payLink" href=""><button style="background:#22c55e;color:#fff;width:100%;padding:12px">Payer KYC 1 USDT / 600 FCFA pour débloquer</button></a>

<script>
let shop=new URLSearchParams(location.search).get('u')||'demo';
document.getElementById('shop').innerText='@'+shop;
let kycPaid=localStorage.getItem('kyc_paid_'+shop)==='paid';
let vip=localStorage.getItem('vip_'+shop);
let isVip=vip&&new Date(vip)>new Date();
let isBuyerKYC=localStorage.getItem('kyc_paid_buyer')==='paid';
let isBuyerVip=localStorage.getItem('vip_buyer')&&new Date(localStorage.getItem('vip_buyer'))>new Date();

if(isVip) document.getElementById('badge').innerHTML='<span class="vip-badge">VIP BOOSTER ⭐</span>';
document.getElementById('payLink').href='pay.html?type='+(kycPaid?'vip':'kyc')+'&u='+shop;

let demoProducts=[{name:'Beat Afro - Kisangani',type:'beat',price:'2 SDA',audio:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},{name:'Instrumental Ndombolo',type:'beat',price:'3 SDA'},{name:'T-shirt AFRI HUB',type:'phys',price:'10 SDA'},{name:'Casquette',type:'phys',price:'5 SDA'},{name:'Pack Beats 10',type:'beat',price:'20 SDA'}];

let html='';
demoProducts.forEach((p,i)=>{
 if(!kycPaid && i>=3){ if(i==3) html+=`<div class="lock">🔒 Boutique sans KYC = Max 3 produits. Paye 1 USDT / 600 FCFA pour illimité<br><a href="pay.html?type=kyc&u=${shop}" style="color:#fff"><u>Débloquer maintenant</u></a></div>`; return; }
 let canPlayFull=isBuyerKYC||isBuyerVip||isVip;
 let audioTag=p.type==='beat'?`<audio controls ${!canPlayFull?'id="aud'+i+'"' :''} src="${p.audio||''}"></audio>${!canPlayFull?'<small>🔒 Preview 30 sec sans KYC acheteur - <a href="pay.html?type=kyc&u=buyer" style="color:#3b82f6">Payer KYC acheteur 1 USDT</a></small>':''}`:'';
 html+=`<div class="card"><b>${p.name}</b> - ${p.price}<br>${audioTag}<br><button style="background:#3b82f6;color:#fff" onclick="buy('${p.name}')">Acheter - Commission 5% ADH</button></div>`;
});
document.getElementById('products').innerHTML=html;

// Bloque audio à 30 sec si pas KYC acheteur
setTimeout(()=>{
 demoProducts.forEach((p,i)=>{
  let a=document.getElementById('aud'+i);
  if(a){a.addEventListener('timeupdate',()=>{if(a.currentTime>30){a.pause();a.currentTime=0;alert('🔒 Preview 30 sec terminée. Paye KYC acheteur 1 USDT / 600 FCFA pour écoute complète.');}})}
 }
},500);

function buy(name){
 let cur=parseFloat(localStorage.getItem('sales_'+shop)||0);
 localStorage.setItem('sales_'+shop,cur+2);
 alert('✅ Achat '+name+' - 5% commission ADH versé au CTO! Vendeur reçoit 95%');
}
</script>
</body></html>
