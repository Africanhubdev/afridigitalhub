<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Vendeur</title><style>body{background:#0f172a;color:#fff;font-family:Arial;padding:15px} .card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0;border:1px solid #334155} .kpi{font-size:22px;color:#22c55e;font-weight:bold} button{padding:10px 15px;border-radius:8px;border:none;font-weight:bold;cursor:pointer} .vip{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff}</style></head><body>
<h2>Dashboard Vendeur - <span id="shopName"></span></h2>
<div class="card">Statut VIP: <b id="vip">NON ACTIF</b> <br><small id="vipExp"></small><br><br><button class="vip" onclick="payerVIP()">Payer Abonnement VIP - 5 USDT (ou 25 ADH / 10 ZMAF / 5 SDA)</button></div>
<div class="card">Ventes Totales: <div class="kpi" id="ventes">0 SDA</div><small>Commission plateforme 5% = <span id="comm">0 ADH</span> collectée</small></div>
<div class="card">Paiements auto-activés: <br>✅ ADH (Natif) - 5 ADH = 1 SDA<br>✅ SDA<br>✅ ZMAF - 2 ZMAF = 1 SDA<br>✅ USDT - 1 USDT ~ 1 SDA<br>✅ USD</div>
<div class="card"><h4>KYC Vendeur</h4><input id="kycNom" placeholder="Nom complet"><input id="kycTel" placeholder="Tel WhatsApp"><input id="kycPiece" placeholder="N° Pièce identité"><button onclick="saveKYC()" style="background:#3b82f6;color:#fff;width:100%;margin-top:10px">Valider KYC</button><p id="kycStatus" style="color:#94a3b8;font-size:12px"></p></div>
<a href="admin.html" style="color:#3b82f6">→ Voir Admin (Toi seul)</a> | <a href="index.html" style="color:#94a3b8">Retour Marché</a>
<script>
let shop = new URLSearchParams(location.search).get('u') || localStorage.getItem('lastShop') || 'demo';
document.getElementById('shopName').innerText='@'+shop;
function payerVIP(){let exp=new Date();exp.setMonth(exp.getMonth()+1);localStorage.setItem('vip_'+shop,exp.toISOString());alert('VIP Activé ! Valide jusquà '+exp.toLocaleDateString()+'\nPayé: 5 USDT / 25 ADH / 10 ZMAF');checkVIP();}
function checkVIP(){let v=localStorage.getItem('vip_'+shop);if(v){let d=new Date(v);if(d>new Date()){document.getElementById('vip').innerText='ACTIF ✅';document.getElementById('vip').style.color='#22c55e';document.getElementById('vipExp').innerText='Expire: '+d.toLocaleDateString();return}}document.getElementById('vip').innerText='NON ACTIF ❌';document.getElementById('vipExp').innerText='Abonnement 5 USDT/mois requis pour vendre';}
function saveKYC(){let k={nom:kycNom.value,tel:kycTel.value,piece:kycPiece.value,shop:shop,date:new Date().toLocaleString()};localStorage.setItem('kyc_'+shop,JSON.stringify(k));document.getElementById('kycStatus').innerText='KYC Enregistré ✅ En attente validation admin';}
checkVIP();
document.getElementById('ventes').innerText=(localStorage.getItem('sales_'+shop)||0)+' SDA';
document.getElementById('comm').innerText=((localStorage.getItem('sales_'+shop)||0)*0.05*5)+' ADH';
</script></body></html>
