<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Vendeur</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:15px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0;border:1px solid #334155}.kpi{font-size:22px;color:#22c55e;font-weight:bold} button{padding:12px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}.vip{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;width:100%} input{width:95%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}.upload{border:2px dashed #475569;padding:15px;border-radius:10px;text-align:center;margin:8px 0;background:#0f172a} img.prev{width:100%;max-height:150px;border-radius:8px;margin-top:8px;display:none;object-fit:cover}</style>
</head><body>
<h2>Dashboard - <span id="shopName"></span></h2><div id="parrainBox" style="background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#000;padding:12px;border-radius:12px;margin:10px;font-weight:bold;display:none">🎁 Bonus Parrainage: <span id="bonusVal">0$</span> <button onclick="claimBonus()" style="background:#000;color:#fbbf24;border:0;padding:6px 12px;border-radius:8px;margin-left:10px">Retirer</button><br><small>Partage: afridigitalhub.shop?ref=@<span class="myShop"></span></small></div>
<div class="card">Statut VIP: <b id="vip">NON ACTIF</b><br><small id="vipExp"></small><br><br><button class="vip" onclick="payerVIP()">Payer Abonnement VIP - 5 USDT (25 ADH / 10 ZMAF / 5 SDA)</button></div>
<div class="card">Ventes: <div class="kpi" id="ventes">0 SDA</div><small>Commission 5% = <span id="comm">0 ADH</span></small></div>

<div class="card">
<h3>🔐 KYC Vendeur PRO (Vérification)</h3>
<input id="kycNom" placeholder="Nom complet comme sur pièce">
<input id="kycTel" placeholder="Tel WhatsApp">
<input id="kycPiece" placeholder="N° Pièce / Passeport">

<label style="font-size:12px;color:#94a3b8">Photo Pièce - Recto (Avant)</label>
<div class="upload"><input type="file" id="fileRecto" accept="image/*" capture="environment" onchange="preview(this,'prevRecto')"><img id="prevRecto" class="prev"></div>

<label style="font-size:12px;color:#94a3b8">Photo Pièce - Verso (Arrière)</label>
<div class="upload"><input type="file" id="fileVerso" accept="image/*" capture="environment" onchange="preview(this,'prevVerso')"><img id="prevVerso" class="prev"></div>

<label style="font-size:12px;color:#94a3b8">Selfie avec Pièce (Preuve que c'est toi)</label>
<div class="upload"><input type="file" id="fileSelfie" accept="image/*" capture="user" onchange="preview(this,'prevSelfie')"><img id="prevSelfie" class="prev"></div>

<button onclick="saveKYC()" style="background:#3b82f6;color:#fff;width:100%;margin-top:12px">Envoyer KYC Complet ✅</button>
<p id="kycStatus" style="font-size:12px;color:#94a3b8;margin-top:8px"></p>
</div>

<a href="admin.html" style="color:#3b82f6">→ Admin CTO</a> | <a href="index.html" style="color:#94a3b8">Marché</a>

<script>
let shop=new URLSearchParams(location.search).get('u')||localStorage.getItem('lastShop')||'demo';
document.getElementById('shopName').innerText='@'+shop;

function preview(input,id){let f=input.files[0];if(f){let r=new FileReader();r.onload=e=>{let img=document.getElementById(id);img.src=e.target.result;img.style.display='block';localStorage.setItem(id+'_'+shop,e.target.result)};r.readAsDataURL(f)}}
function payerVIP(){let exp=new Date();exp.setMonth(exp.getMonth()+1);localStorage.setItem('vip_'+shop,exp.toISOString());checkVIP();alert('VIP Activé 30 jours - 5 USDT / 25 ADH');}
function checkVIP(){let v=localStorage.getItem('vip_'+shop);if(v&&new Date(v)>new Date()){document.getElementById('vip').innerText='ACTIF ✅';document.getElementById('vip').style.color='#22c55e';document.getElementById('vipExp').innerText='Expire: '+new Date(v).toLocaleDateString()}else{document.getElementById('vip').innerText='NON ACTIF ❌';document.getElementById('vipExp').innerText='5 USDT/mois requis'}}
function saveKYC(){
 let data={nom:kycNom.value,tel:kycTel.value,piece:kycPiece.value,shop:shop,date:new Date().toLocaleString(),recto:localStorage.getItem('prevRecto_'+shop)||'',verso:localStorage.getItem('prevVerso_'+shop)||'',selfie:localStorage.getItem('prevSelfie_'+shop)||''};
 if(!data.nom||!data.recto||!data.verso){alert('Remplis nom + photo recto + verso obligatoires!');return}
 localStorage.setItem('kyc_'+shop,JSON.stringify(data));
 document.getElementById('kycStatus').innerText='✅ KYC PRO envoyé! Recto + Verso + Selfie enregistrés. Validation sous 24h.';
}
function showBonus(){
  let b=parseFloat(localStorage.getItem('afri_bonus_'+shop)||'0');
  let box=document.getElementById('parrainBox');
  let val=document.getElementById('bonusVal');
  let my=document.querySelectorAll('.myShop');
  if(box){box.style.display='block';}
  if(val){val.innerText=b.toFixed(2)+'$';}
  my.forEach(e=>e.innerText=shop);
}
function claimBonus(){
  let b=parseFloat(localStorage.getItem('afri_bonus_'+shop)||'0');
  if(b<=0){alert('Pas encore de bonus');return;}
  alert('Demande retrait '+b.toFixed(2)+'$ envoyée au CTO. Contact WhatsApp.');
  localStorage.setItem('afri_bonus_'+shop,'0');
  showBonus();
}
showBonus();checkVIP();
// charge preview si déjà fait
['prevRecto','prevVerso','prevSelfie'].forEach(id=>{let d=localStorage.getItem(id+'_'+shop);if(d){let im=document.getElementById(id);im.src=d;im.style.display='block'}});
document.getElementById('ventes').innerText=(localStorage.getItem('sales_'+shop)||0)+' SDA';
document.getElementById('comm').innerText=((localStorage.getItem('sales_'+shop)||0)*0.05*5)+' ADH';
</script>
</body></html>
