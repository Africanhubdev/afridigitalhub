<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afridigital Hub - Marketplace SDA</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;padding:20px}
.pay-btn{background:#1e293b;border:1px solid #334155;padding:15px;margin:8px;border-radius:12px;display:inline-block;min-width:110px;cursor:pointer}
.pay-btn.active:hover{background:#3b82f6}
small{color:#94a3b8}
</style>
</head>
<body>

<h1>Afridigital Hub</h1>
<h2>1 SDA = <span id="tauxADH">5</span> ADH = 2 ZMAF</h2>
<p>Prix principal: <span id="prixPrincipal">1</span> SDA</p>

<div id="paiementsGrid" style="margin-top:20px"></div>

<div style="text-align:center;margin-top:30px">
<a href="become-seller.html" style="display:inline-block;background:#3b82f6;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Devenir Vendeur</a>
<p style="color:#aaa;font-size:13px;margin-top:10px">Paiement sécurisé via SDA / ADH / ZMAF</p>
</div>

<script>
const CONFIG = {
  prixBaseSDA: 1,
  tauxADH: 5,
  tauxZMAF: 2,
  paiements: [
    { code: 'ZMAF', nom: 'ZMAF', actif: true },
    { code: 'SDA', nom: 'SDA', actif: true },
    { code: 'ADH', nom: 'ADH', actif: true },
    { code: 'USDT', nom: 'USDT', actif: true },
    { code: 'USDC', nom: 'USDC', actif: true },
    { code: 'CDF', nom: 'CDF', actif: true },
    { code: 'XOF', nom: 'FCFA', actif: true },
    { code: 'UGX', nom: 'UGX', actif: true },
    { code: 'USD', nom: 'USD', actif: true }
  ]
};

function afficher() {
  document.getElementById('tauxADH').innerText = CONFIG.tauxADH;
  document.getElementById('prixPrincipal').innerText = CONFIG.prixBaseSDA;
  const grid = document.getElementById('paiementsGrid');
  grid.innerHTML = '';
  CONFIG.paiements.forEach(p => {
    if(p.actif){
      let prix = p.code === 'ADH' ? CONFIG.tauxADH : p.code === 'ZMAF' ? CONFIG.tauxZMAF : CONFIG.prixBaseSDA;
      const btn = document.createElement('div');
      btn.className = 'pay-btn active';
      if(p.code === 'ADH' || p.code === 'ZMAF'){
        btn.innerHTML = `${p.nom}<br><small>${prix} ${p.code}</small>`;
      } else {
        btn.innerHTML = `${p.nom}<br><small>Payer en ${p.code}</small>`;
      }
      grid.appendChild(btn);
    }
  });
}
afficher();
</script>
</body>
</html>
